[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bam-ci"
version = "1.0.0"
description = "Pre-processamento do BAM 1.2 subsazonal em Python: analises GRIB (ERA5/FNL/GFS) -> condicao inicial espectral (TQ126L042) e SST semanal (OISST/RTG)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "The bam-ci authors" }]
keywords = ["bam", "cptec", "inpe", "meteorologia", "condicao-inicial", "espectral", "grib", "era5", "sst"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
grib = ["eccodes>=1.6"]
netcdf = ["xarray>=2023.1", "netCDF4>=1.6"]
download = ["cdsapi>=0.7"]
dev = ["pytest>=7", "scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/<organizacao>/bam-ci"
Source = "https://github.com/<organizacao>/bam-ci"
Issues = "https://github.com/<organizacao>/bam-ci/issues"

[project.scripts]
bamci = "bamci.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bamci = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
